[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smi-window-tracker"
version = "0.1.0"
description = "Offline monitoring primitives for the SMI Kapton-window lifetime IOC"
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["src/smi_window_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
